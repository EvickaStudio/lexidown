name: Build and publish distributions

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  # A newer main push must not interrupt an upload already in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.6.0 twine==7.0.0
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [lint, sdist]
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/wheels.yml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: python -m pip install twine==7.0.0 html5lib==1.1
      # Always compile the current source archive; never reuse a cached project wheel.
      - run: python -m pip wheel --no-deps --no-cache-dir dist/*.tar.gz --wheel-dir wheelhouse
      - run: python -m twine check --strict wheelhouse/*.whl
      - run: python -m pip install --no-deps wheelhouse/*.whl
      - name: Test the installed wheel outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tests/scripts"
          cp -R tests "$RUNNER_TEMP/wheel-tests/"
          cp scripts/check_wheel.py scripts/benchmark.py scripts/compare_converters.py scripts/prepare_release.py "$RUNNER_TEMP/wheel-tests/scripts/"
          cd "$RUNNER_TEMP/wheel-tests"
          python -m scripts.check_wheel
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          node-version: "22"
      - run: npm ci
        if: matrix.python-version == '3.14'
      - name: Compare installed wheel output with JavaScript
        if: matrix.python-version == '3.14'
        run: python -I scripts/differential.py

  wheels:
    needs: sdist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_ARCHS: native
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
      CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
      # Only tests and their helpers are copied; imports must use the installed wheel.
      CIBW_TEST_SOURCES: tests scripts/check_wheel.py scripts/benchmark.py scripts/compare_converters.py scripts/prepare_release.py
      CIBW_TEST_REQUIRES: html5lib==1.1
      CIBW_TEST_COMMAND: python -m scripts.check_wheel
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - run: python -m pip install cibuildwheel==4.2.1 twine==7.0.0
      # Building the downloaded sdist also verifies that no checkout-only files are needed.
      - run: python -m cibuildwheel dist/*.tar.gz --output-dir wheelhouse
      - run: python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  prepare-release:
    needs: [lint, sdist, wheels]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and check PyPI version
        id: release
        run: python scripts/prepare_release.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.publish == 'true'
        with:
          name: pypi-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lexidown/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: dist
      - name: Publish tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Only identical files from a validated partial release may be skipped.
          skip-existing: true
